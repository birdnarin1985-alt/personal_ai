<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Indra's Net Personal AI OS — Zero-Hop Pointer-Only Edition (2026)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #090c10; color: #f0f6fc; overflow: hidden; height: 100vh; width: 100vw; }
        
        /* WebGL & AR Visualizer Canvas Layer */
        #ar-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        /* HUD Glassmorphism Overlay */
        .hud-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;
            pointer-events: none; display: flex; flex-direction: column; justify-content: space-between;
            padding: 16px; background: radial-gradient(circle at center, transparent 35%, rgba(9, 12, 16, 0.85) 100%);
        }
        
        .hud-header {
            background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.25); border-radius: 12px;
            padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;
            pointer-events: auto; box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        
        .status-badge { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; font-weight: 600; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background-color: #38bdf8; box-shadow: 0 0 10px #38bdf8; }
        .dot.active { background-color: #22c55e; box-shadow: 0 0 10px #22c55e; }
        .dot.alert { background-color: #ef4444; box-shadow: 0 0 12px #ef4444; animation: pulse 0.8s infinite alternate; }
        
        @keyframes pulse { from { opacity: 0.4; } to { opacity: 1; } }
        
        .pointer-info { font-family: monospace; color: #38bdf8; font-size: 0.8rem; margin-top: 2px; }
        
        /* Chat & Action Panel */
        .hud-bottom {
            background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 16px;
            padding: 16px; pointer-events: auto; max-width: 650px; width: 100%; margin: 0 auto;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        
        .chat-logs { height: 140px; overflow-y: auto; margin-bottom: 12px; font-size: 0.88rem; line-height: 1.45; display: flex; flex-direction: column; gap: 8px; }
        .log-msg { padding: 8px 12px; border-radius: 8px; background: rgba(255, 255, 255, 0.05); }
        .log-msg.ai { border-left: 3px solid #38bdf8; background: rgba(56, 189, 248, 0.1); }
        .log-msg.user { border-left: 3px solid #22c55e; background: rgba(34, 197, 94, 0.1); }
        .log-msg.alert { border-left: 3px solid #ef4444; background: rgba(239, 68, 68, 0.15); color: #fca5a5; }
        .log-msg.tot { border-left: 3px solid #fbbf24; background: rgba(251, 191, 36, 0.12); color: #fef08a; font-family: monospace; }
        
        .controls { display: flex; gap: 8px; flex-wrap: wrap; }
        input[type="text"] {
            flex: 1; min-width: 180px; background: rgba(0, 0, 0, 0.45); border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px; padding: 10px 14px; color: #fff; font-size: 0.9rem; outline: none;
        }
        button {
            background: #0284c7; color: white; border: none; padding: 10px 14px; border-radius: 8px;
            font-weight: 600; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 6px; font-size: 0.85rem;
        }
        button:hover { background: #0369a1; transform: translateY(-1px); }
        button.purple { background: #7c3aed; }
        button.purple:hover { background: #6d28d9; }
        button.amber { background: #d97706; }
        button.amber:hover { background: #b45309; }
        button.danger { background: #dc2626; }
        button.danger:hover { background: #b91c1c; }
    </style>
</head>
<body>

    <!-- WebGL AR & Voxel Visualizer Canvas -->
    <canvas id="ar-canvas"></canvas>

    <!-- HUD Overlay Interface -->
    <div class="hud-overlay">
        <div class="hud-header">
            <div>
                <div style="font-weight: bold; font-size: 0.95rem;">Indra's Net AI OS (Pointer-Only Edition)</div>
                <div class="pointer-info" id="pointer-display">Base Address: 000000Z0 | Volatile LPDDR RAM (MobiEdit Active)</div>
            </div>
            <div class="status-badge">
                <div id="status-dot" class="dot active"></div>
                <span id="status-text">Zero-Hop Ready</span>
            </div>
        </div>

        <div class="hud-bottom">
            <div class="chat-logs" id="chat-logs">
                <div class="log-msg ai">🙏 ระบบพร้อมทำงานบน LPDDR Unified RAM (Base Address 000000Z0) ออฟไลน์ 100% ตามหลักโยนิโสมนสิการ</div>
            </div>
            
            <div class="controls">
                <input type="text" id="user-input" placeholder="พิมพ์คำสั่ง หรือถามสัจธรรม..." onkeydown="if(event.key==='Enter') sendPrompt()">
                <button onclick="sendPrompt()">ส่ง</button>
                <button onclick="triggerToTReasoning()" class="amber">Tree of Thoughts (ToT)</button>
                <button onclick="triggerInPlaceEdit()" class="purple">สลัก RAM กลางอากาศ</button>
                <button onclick="triggerScamAlert()" class="danger">ส่องเตือนบัญชีม้า</button>
            </div>
        </div>
    </div>

    <!-- Application Engine -->
    <script>
        // --- 1. Base Pointer Address & State ---
        const BASE_POINTER = "000000Z0";
        let memoryState = {
            kammaText: "สัจธรรมเจตจำนง: รู้เท่าทันสื่อ โยนิโสมนสิการ ป้องกันบัญชีม้า",
            voxelsAlert: false,
            shockwaveActive: false,
            shockwaveRadius: 0,
            totActive: false
        };

        // --- 2. Zero-Hop Hydration on Launch ---
        function hydrateMemoryFromChat() {
            const savedKamma = localStorage.getItem("kamma.txt") || memoryState.kammaText;
            memoryState.kammaText = savedKamma;
            addLog("ai", `⚡ [Zero-Hop Hydration] ฉีดพอยน์เตอร์ความจำเข้า RAM สดๆ: "${savedKamma.substring(0, 32)}..."`);
        }

        // --- 3. WebGL Voxel Rendering Engine (60 FPS) ---
        const canvas = document.getElementById("ar-canvas");
        const ctx = canvas.getContext("2d");
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        // 3D Voxel Nodes Setup
        const VOXEL_COUNT = 180;
        const voxels = [];
        for (let i = 0; i < VOXEL_COUNT; i++) {
            voxels.push({
                x: (Math.random() - 0.5) * width * 0.85,
                y: (Math.random() - 0.5) * height * 0.85,
                z: Math.random() * 500,
                baseSize: Math.random() * 4 + 2,
                angle: Math.random() * Math.PI * 2,
                speed: Math.random() * 0.02 + 0.005
            });
        }

        function renderVoxelEngine() {
            ctx.clearRect(0, 0, width, height);
            const centerX = width / 2;
            const centerY = height / 2 - 40;

            // Render Shockwave Effect
            if (memoryState.shockwaveActive) {
                memoryState.shockwaveRadius += 14;
                ctx.beginPath();
                ctx.arc(centerX, centerY, memoryState.shockwaveRadius, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(251, 191, 36, ${Math.max(0, 1 - memoryState.shockwaveRadius / 450)})`;
                ctx.lineWidth = 6;
                ctx.stroke();

                if (memoryState.shockwaveRadius > 450) {
                    memoryState.shockwaveActive = false;
                    memoryState.shockwaveRadius = 0;
                }
            }

            // Render 3D Voxel Nodes & Tree Connections
            voxels.forEach((v, idx) => {
                v.angle += v.speed;
                const radius = 180 + Math.sin(v.angle) * 35;
                const projX = centerX + Math.cos(v.angle + v.z) * radius;
                const projY = centerY + Math.sin(v.angle) * (radius * 0.5);

                // Render ToT Tree Lines if active
                if (memoryState.totActive && idx % 6 === 0) {
                    ctx.beginPath();
                    ctx.moveTo(centerX, centerY);
                    ctx.lineTo(projX, projY);
                    ctx.strokeStyle = "rgba(251, 191, 36, 0.25)";
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }

                ctx.beginPath();
                ctx.rect(projX, projY, v.baseSize * 1.5, v.baseSize * 1.5);

                if (memoryState.voxelsAlert) {
                    ctx.fillStyle = "#ef4444";
                    ctx.shadowColor = "#ef4444";
                    ctx.shadowBlur = 14;
                } else if (memoryState.shockwaveActive) {
                    ctx.fillStyle = "#fbbf24";
                    ctx.shadowColor = "#fbbf24";
                    ctx.shadowBlur = 18;
                } else if (memoryState.totActive) {
                    ctx.fillStyle = "#f59e0b";
                    ctx.shadowColor = "#f59e0b";
                    ctx.shadowBlur = 12;
                } else {
                    ctx.fillStyle = "#38bdf8";
                    ctx.shadowColor = "#38bdf8";
                    ctx.shadowBlur = 8;
                }
                ctx.fill();
            });

            requestAnimationFrame(renderVoxelEngine);
        }

        // --- 4. Interactive Functions ---
        function addLog(type, text) {
            const logs = document.getElementById("chat-logs");
            const msg = document.createElement("div");
            msg.className = `log-msg ${type}`;
            msg.innerText = text;
            logs.appendChild(msg);
            logs.scrollTop = logs.scrollHeight;
        }

        function sendPrompt() {
            const input = document.getElementById("user-input");
            const text = input.value.trim();
            if (!text) return;

            addLog("user", "👤 " + text);
            input.value = "";

            setTimeout(() => {
                if (memoryState.voxelsAlert) {
                    addLog("alert", "⚠️ [Scam Shield] หยุดก่อน! เลขบัญชีม้านี้มีความเสี่ยงสูง ห้ามโอนเงินเด็ดขาด! (โยนิโสมนสิการ)");
                } else {
                    addLog("ai", `💡 [Local AI] ตอบตามสัจธรรมความจริง "หยุดคิดก่อนเชื่อ ใคร่ครวญก่อนแชร์" (Base Address: ${BASE_POINTER})`);
                }
            }, 250);
        }

        function triggerToTReasoning() {
            memoryState.totActive = !memoryState.totActive;
            if (memoryState.totActive) {
                addLog("tot", "🌳 [Tree of Thoughts] แตกกิ่งก้านความคิด 5 ทางเลือกบน RAM 1.5GB... ประเมินผลลัพธ์ล่วงหน้าก่อนเลือกคำตอบสัจธรรมที่ดีที่สุด!");
            } else {
                addLog("ai", "🍃 [ToT Complete] รวบยอดความคิดเรียบร้อยแล้ว คืนสภาวะปกติ");
            }
        }

        function triggerInPlaceEdit() {
            memoryState.shockwaveActive = true;
            memoryState.shockwaveRadius = 0;
            memoryState.voxelsAlert = false;
            document.getElementById("status-dot").className = "dot active";
            document.getElementById("status-text").innerText = "RAM Edit In-Place";

            const newFact = "สลักปัญญาใหม่ ณ " + new Date().toLocaleTimeString() + " (MobiEdit BP-Free W8A16)";
            memoryState.kammaText = newFact;
            localStorage.setItem("kamma.txt", newFact);

            addLog("ai", `✨ [In-Place RAM Edit] สลักค่าน้ำหนักความรู้ใหม่ลง LPDDR RAM ใน 0.001 วินาที! 💥 (${newFact})`);
        }

        function triggerScamAlert() {
            memoryState.voxelsAlert = !memoryState.voxelsAlert;
            const dot = document.getElementById("status-dot");
            const text = document.getElementById("status-text");

            if (memoryState.voxelsAlert) {
                dot.className = "dot alert";
                text.innerText = "WARNING: SCAM DETECTED";
                addLog("alert", "🚨 [AR Vision OCR] ส่องพบเลขบัญชีม้า! Voxel เปลี่ยนเป็นสีแดงเพลิงสว่างวาบเตือนภัยดึงสติทันที!");
            } else {
                dot.className = "dot active";
                text.innerText = "Zero-Hop Ready";
                addLog("ai", "✅ [System Normal] คืนสภาวะ Voxel สีฟ้าปลอดภัย");
            }
        }

        // --- 5. Lifecycle Auto-Save ---
        function autoSaveKammaOnClose() {
            localStorage.setItem("kamma.txt", memoryState.kammaText);
        }

        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "hidden") autoSaveKammaOnClose();
        });

        // Initialize Engine
        window.onload = () => {
            hydrateMemoryFromChat();
            renderVoxelEngine();
        };
    </script>
</html>
