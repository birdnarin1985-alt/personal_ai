<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Indra's Net AI OS — Native Container Edition (Golden Techo v6)</title>
    <style>
        /* --- Native App Container Locks --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #090c10;
            color: #f0f6fc;
            overscroll-behavior: none;
            touch-action: manipulation;
        }

        /* WebGL Canvas */
        #ar-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* HUD Safe Area Overlay */
        .hud-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
        }

        /* Native Glass Header */
        .hud-header {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(251, 191, 36, 0.3);
            border-radius: 14px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: auto;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .rate-badge {
            display: flex;
            gap: 8px;
            align-items: center;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.78rem;
        }

        .stat-item {
            background: rgba(251, 191, 36, 0.1);
            border: 1px solid rgba(251, 191, 36, 0.25);
            padding: 4px 8px;
            border-radius: 6px;
            color: #fbbf24;
        }

        .stat-item.full {
            background: rgba(34, 197, 94, 0.15);
            border-color: #22c55e;
            color: #4ade80;
            font-weight: bold;
        }

        /* Native Bottom Controller */
        .hud-bottom {
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 18px;
            padding: 14px;
            pointer-events: auto;
            max-width: 620px;
            width: 100%;
            margin: 0 auto;
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.35s ease;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .hud-bottom.minimized {
            transform: translateY(calc(100% + 20px));
            opacity: 0.15;
        }

        .hud-bottom.minimized:hover {
            transform: translateY(0);
            opacity: 1;
        }

        .chat-logs {
            height: 90px;
            overflow-y: auto;
            margin-bottom: 8px;
            font-size: 0.85rem;
            line-height: 1.4;
        }

        .log-msg {
            padding: 6px 10px;
            border-radius: 8px;
            margin-bottom: 4px;
            background: rgba(0, 0, 0, 0.35);
        }

        .controls {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        input[type="text"] {
            flex: 1;
            min-width: 130px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #fbbf24;
            border-radius: 8px;
            padding: 8px 12px;
            color: #fff;
            font-size: 0.88rem;
            outline: none;
            -webkit-user-select: text;
            user-select: text;
        }

        button {
            background: #d97706;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.8rem;
            transition: transform 0.1s active;
        }

        button:active {
            transform: scale(0.96);
        }

        button.net-btn { background: #059669; }
        button.net-btn.mobile { background: #d97706; }

        .loading-banner {
            position: absolute;
            top: 18%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid #fbbf24;
            border-radius: 12px;
            padding: 12px 20px;
            text-align: center;
            color: #fbbf24;
            font-family: ui-monospace, SFMono-Regular, monospace;
            z-index: 20;
            box-shadow: 0 0 30px rgba(251, 191, 36, 0.3);
            pointer-events: none;
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body>

    <canvas id="ar-canvas"></canvas>

    <!-- Data Stream Banner -->
    <div class="loading-banner" id="loading-banner">
        <div style="font-size: 0.92rem; font-weight: bold;" id="banner-title">⚡ STREAMING VIA WI-FI (150 MB/s)...</div>
        <div style="font-size: 0.74rem; color: #aaa;" id="banner-sub">Base Pointer: 000000Z0 | Golden Techo Stream</div>
    </div>

    <div class="hud-overlay" id="hud-overlay">
        <!-- Native Glass Header -->
        <div class="hud-header">
            <div>
                <strong style="color: #fbbf24; font-size: 0.95rem;">Indra's Net AI OS</strong>
                <div style="font-family: monospace; font-size: 0.7rem; color: #aaa;">Base: 000000Z0</div>
            </div>

            <div class="rate-badge">
                <div class="stat-item full" id="stat-ram">RAM: 100% FULL</div>
                <div class="stat-item" id="stat-speed">150 MB/s</div>
                <div class="stat-item" id="stat-tokens">38 T/s</div>
            </div>

            <div style="display: flex; gap: 6px;">
                <button id="net-toggle-btn" class="net-btn" onclick="toggleNetworkMode()">📡 Wi-Fi</button>
                <button onclick="toggleFocusMode()" style="background: #475569;">👁️ Focus Box</button>
            </div>
        </div>

        <!-- Native Bottom Controller -->
        <div class="hud-bottom" id="hud-bottom">
            <div class="chat-logs" id="chat-logs">
                <div class="log-msg" style="border-left: 3px solid #22c55e;">✅ ล็อกคอนเทนเนอร์ Native App 100% บน LPDDR RAM (Base Address 000000Z0) ตามหลัก Golden Techo & โยนิโสมนสิการ</div>
            </div>
            <div class="controls">
                <input type="text" id="user-input" placeholder="พิมพ์คำสั่ง..." onkeydown="if(event.key==='Enter') send()">
                <button onclick="send()">ส่ง</button>
                <button onclick="reloadStreamEffect()" style="background: #b45309;">🔄 สตรีมสดอีกครั้ง</button>
                <button onclick="toggleFocusMode()" style="background: #7c3aed;">ซ่อน/แสดง แผงควบคุม</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. CONFIG & GOLDEN RATIO CONSTANTS (NO MAGIC NUMBERS) ---
        const CONFIG = {
            GOLDEN_RATIO: 1.618033988749895,
            GOLDEN_ANGLE: Math.PI * (3 - Math.sqrt(5)),
            CENTER_Y_RATIO: 0.382, // 1 - (1 / Golden Ratio)
            BASE_POINTER: "000000Z0",
            VOXEL_COUNT: 162,
            STREAM_PARTICLE_COUNT: 120,
            COLOR_GOLD: "#fbbf24",
            COLOR_FIRE: "#f59e0b"
        };

        // --- 2. NATIVE APP GESTURE LOCKS ---
        document.addEventListener('gesturestart', (e) => e.preventDefault());
        document.addEventListener('gesturechange', (e) => e.preventDefault());
        document.addEventListener('gestureend', (e) => e.preventDefault());
        
        let lastTouchEnd = 0;
        document.addEventListener('touchend', (e) => {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) {
                e.preventDefault();
            }
            lastTouchEnd = now;
        }, false);

        // --- 3. CANVAS & GPU SHADER RENDERER ---
        const canvas = document.getElementById("ar-canvas");
        const ctx = canvas.getContext("2d");
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        let currentNetMode = "wifi";
        let isLoading = true;
        let streamProgress = 0;

        // Data Stream Particles
        const streamParticles = Array.from({length: CONFIG.STREAM_PARTICLE_COUNT}, () => {
            const angle = Math.random() * Math.PI * 2;
            const dist = Math.max(width, height) * 0.7;
            return {
                currentDist: dist,
                speed: Math.random() * 8 + 6,
                angle: angle,
                size: Math.random() * 3 + 1.5
            };
        });

        // Golden Spiral 3D Voxel Nodes
        const voxels = Array.from({length: CONFIG.VOXEL_COUNT}, (_, idx) => {
            const phi = idx * CONFIG.GOLDEN_ANGLE;
            return {
                x: Math.cos(phi) * idx * 1.8,
                y: Math.sin(phi) * idx * 1.8,
                z: Math.random() * 350,
                angle: phi,
                speed: Math.random() * 0.015 + 0.005,
                activated: false,
                intensity: 0
            };
        });

        function render() {
            ctx.clearRect(0, 0, width, height);
            
            const centerX = width / 2;
            const centerY = height * CONFIG.CENTER_Y_RATIO;

            if (isLoading) {
                const speedMult = currentNetMode === "wifi" ? 1.0 : 0.45;
                streamProgress += 0.012 * speedMult;

                streamParticles.forEach(p => {
                    p.currentDist -= p.speed * speedMult;
                    if (p.currentDist < 0) p.currentDist = Math.max(width, height) * 0.7;

                    const posX = centerX + Math.cos(p.angle) * p.currentDist;
                    const posY = centerY + Math.sin(p.angle) * p.currentDist;

                    ctx.beginPath();
                    ctx.moveTo(posX, posY);
                    ctx.lineTo(posX + Math.cos(p.angle) * 16, posY + Math.sin(p.angle) * 16);
                    ctx.strokeStyle = currentNetMode === "wifi" ? CONFIG.COLOR_GOLD : CONFIG.COLOR_FIRE;
                    ctx.lineWidth = p.size;
                    ctx.stroke();
                });

                const activeLimit = Math.floor(streamProgress * CONFIG.VOXEL_COUNT);
                voxels.forEach((v, idx) => {
                    if (idx < activeLimit) {
                        v.activated = true;
                        if (v.intensity < 1) v.intensity += 0.08;
                    }
                });

                if (streamProgress >= 1.0) {
                    isLoading = false;
                    const banner = document.getElementById("loading-banner");
                    banner.style.opacity = "0";
                    setTimeout(() => { banner.style.display = "none"; }, 500);
                }
            }

            // Render Voxel Box (Golden Techo Spiral)
            voxels.forEach(v => {
                v.angle += v.speed;
                const radius = 120 + Math.sin(v.angle) * 26;
                const projX = centerX + Math.cos(v.angle + v.z) * radius;
                const projY = centerY + Math.sin(v.angle) * (radius * 0.55);

                if (v.activated) {
                    ctx.beginPath();
                    ctx.rect(projX, projY, 4.5 * v.intensity, 4.5 * v.intensity);
                    ctx.fillStyle = currentNetMode === "wifi" 
                        ? `rgba(251, 191, 36, ${v.intensity})` 
                        : `rgba(245, 158, 11, ${v.intensity})`;
                    ctx.shadowColor = CONFIG.COLOR_GOLD;
                    ctx.shadowBlur = 12 * v.intensity;
                    ctx.fill();
                }
            });

            requestAnimationFrame(render);
        }

        function toggleNetworkMode() {
            const btn = document.getElementById("net-toggle-btn");
            const statSpeed = document.getElementById("stat-speed");
            const statTokens = document.getElementById("stat-tokens");

            if (currentNetMode === "wifi") {
                currentNetMode = "mobile";
                btn.className = "net-btn mobile";
                btn.innerText = "📱 Mobile Data";
                statSpeed.innerText = "45 MB/s";
                statTokens.innerText = "24 T/s";
                addLog("log-msg", "📱 สลับเป็น Mobile Data: โหมดประหยัดพลังงานเน็ต");
            } else {
                currentNetMode = "wifi";
                btn.className = "net-btn";
                btn.innerText = "📡 Wi-Fi";
                statSpeed.innerText = "150 MB/s";
                statTokens.innerText = "38 T/s";
                addLog("log-msg", "📡 สลับเป็น Wi-Fi Mode: สตรีมมิ่งสปีดเต็มเรต!");
            }
            reloadStreamEffect();
        }

        function reloadStreamEffect() {
            isLoading = true;
            streamProgress = 0;
            const banner = document.getElementById("loading-banner");
            const title = document.getElementById("banner-title");
            title.innerText = currentNetMode === "wifi" ? "⚡ STREAMING VIA WI-FI (150 MB/s)..." : "📱 STREAMING VIA MOBILE DATA (45 MB/s)...";
            banner.style.display = "block";
            banner.style.opacity = "1";
            voxels.forEach(v => { v.activated = false; v.intensity = 0; });
        }

        function toggleFocusMode() {
            document.getElementById("hud-bottom").classList.toggle("minimized");
        }

        function send() {
            const input = document.getElementById("user-input");
            if (!input.value.trim()) return;
            addLog("log-msg", `👤 ${input.value}`);
            input.value = "";
        }

        function addLog(className, text) {
            const logs = document.getElementById("chat-logs");
            const msg = document.createElement("div");
            msg.className = className;
            msg.style.borderLeft = "3px solid #fbbf24";
            msg.innerText = text;
            logs.appendChild(msg);
            logs.scrollTop = logs.scrollHeight;
        }

        render();
    </script>
</body>
</html>
